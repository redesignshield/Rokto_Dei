name: Verify & Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Optional live HTTPS URL (for Play Store TWA APK via Bubblewrap). Leave blank to build standalone APK directly.'
        required: false
        default: ''
      package_id:
        description: 'Android applicationId (reverse domain format)'
        required: false
        default: 'com.roktodei.app'
      app_name:
        description: 'Android Launcher App Name'
        required: false
        default: 'Rokto Dei'

jobs:
  verify:
    name: TypeCheck, Rules Lint, Tests & Production Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript & Firestore Rules Lint
        run: npm run lint

      - name: Run Security & Logic Tests
        run: npm test -- --run

      - name: Build Production PWA Bundle
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.app_url || vars.APP_URL || '' }}
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roktodei-web-dist
          path: dist/

  build-capacitor-apk:
    name: Build Installable Android APK
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.app_url == '')
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.read_version.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read App Version from package.json
        id: read_version
        run: |
          APP_VER="$(node -p "require('./package.json').version")"
          echo "app_version=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$APP_VER" >> "$GITHUB_ENV"

      - name: Download Built Web Bundle
        uses: actions/download-artifact@v4
        with:
          name: roktodei-web-dist
          path: cap-build/dist

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17 (Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK, Licenses & ImageMagick
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || ls -1 "$SDK_PATH"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          sudo mkdir -p "$SDK_PATH/licenses" && sudo chmod -R a+rwX "$SDK_PATH/licenses" || true
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          if [ ! -d "$SDK_PATH/build-tools" ] || [ -z "$(ls -A "$SDK_PATH/build-tools" 2>/dev/null)" ]; then
            yes | "$SDKM" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Initialize Capacitor Android Project
        working-directory: cap-build
        run: |
          PKG_ID="${{ inputs.package_id || 'com.roktodei.app' }}"
          APP_NAME="${{ inputs.app_name || 'Rokto Dei' }}"

          cat <<EOF > package.json
          {
            "name": "roktodei-android",
            "version": "${APP_VERSION}",
            "private": true
          }
          EOF

          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/browser@6 @capacitor/app@6

          cat <<EOF > capacitor.config.json
          {
            "appId": "$PKG_ID",
            "appName": "$APP_NAME",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Configure Rokto Dei App Icons, Splash, Version & Permissions
        run: |
          RES_DIR="cap-build/android/app/src/main/res"
          SRC_ICON="public/pwa-512x512.png"
          SRC_MASKABLE="public/pwa-maskable-512x512.png"

          generate_icon_set() {
            local density="$1"
            local size="$2"
            local fg_size="$3"
            mkdir -p "$RES_DIR/mipmap-$density"
            convert "$SRC_ICON" -resize "${size}x${size}" "$RES_DIR/mipmap-$density/ic_launcher.png"
            convert "$SRC_ICON" -resize "${size}x${size}" "$RES_DIR/mipmap-$density/ic_launcher_round.png"
            convert "$SRC_MASKABLE" -resize "${fg_size}x${fg_size}" "$RES_DIR/mipmap-$density/ic_launcher_foreground.png"
          }

          generate_icon_set mdpi 48 108
          generate_icon_set hdpi 72 162
          generate_icon_set xhdpi 96 216
          generate_icon_set xxhdpi 144 324
          generate_icon_set xxxhdpi 192 432

          find "$RES_DIR" -name "splash.png" | while read -r splash_file; do
            dims="$(identify -format "%wx%h" "$splash_file" 2>/dev/null || echo "480x800")"
            convert -size "$dims" xc:"#FAF8F9" \( "$SRC_MASKABLE" -resize 220x220 \) -gravity center -composite "$splash_file"
          done

          PKG_ID="${{ inputs.package_id || 'com.roktodei.app' }}"
          export PKG_ID
          node -e '
            const fs = require("fs");
            const p = "cap-build/android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const pkgId = process.env.PKG_ID || "com.roktodei.app";
            const perms = [
              "<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"
            ].filter(line => !xml.includes(line)).join("\n    ");
            if (perms) {
              xml = xml.replace("<application", perms + "\n\n    <application");
            }

            if (xml.includes("android:launchMode=\"singleTop\"")) {
              xml = xml.replace("android:launchMode=\"singleTop\"", "android:launchMode=\"singleTask\"");
            } else if (!xml.includes("android:launchMode=")) {
              xml = xml.replace("<activity", "<activity android:launchMode=\"singleTask\"");
            }

            const deepLinkFilter =
              "            <intent-filter>\n" +
              "                <action android:name=\"android.intent.action.VIEW\" />\n" +
              "                <category android:name=\"android.intent.category.DEFAULT\" />\n" +
              "                <category android:name=\"android.intent.category.BROWSABLE\" />\n" +
              "                <data android:scheme=\"" + pkgId + "\" android:host=\"auth\" />\n" +
              "            </intent-filter>";

            if (!xml.includes("android:host=\"auth\"")) {
              xml = xml.replace("</activity>", deepLinkFilter + "\n        </activity>");
            }

            fs.writeFileSync(p, xml);

            const gradlePath = "cap-build/android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            const ver = process.env.APP_VERSION || "1.0.0";
            const [maj = 1, min = 0, pat = 0] = ver.split(".").map(n => parseInt(n, 10) || 0);
            const verCode = maj * 10000 + min * 100 + pat;
            gradle = gradle
              .replace(/versionCode\s+\d+/, `versionCode ${verCode}`)
              .replace(/versionName\s+"[^"]+"/, `versionName "${ver}"`);
            fs.writeFileSync(gradlePath, gradle);
          '

      - name: Build & Sign Release APK
        working-directory: cap-build
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon)

          STORE_PASS="${KS_PASS:-roktodei123}"
          ALIAS_PASS="${KEY_PASS:-$STORE_PASS}"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android.keystore
          else
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias roktodei \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$ALIAS_PASS" \
              -dname "CN=Rokto Dei, OU=Mobile, O=Rokto Dei, L=Dhaka, ST=Dhaka, C=BD"
          fi

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(ls -d "$SDK_PATH"/build-tools/* | sort -V | tail -n 1)"
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          OUT_APK="RoktoDei-v${APP_VERSION}.apk"

          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" RoktoDei-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks android.keystore \
            --ks-key-alias roktodei \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$ALIAS_PASS" \
            --out "$OUT_APK" \
            RoktoDei-aligned.apk
          "$BUILD_TOOLS/apksigner" verify "$OUT_APK"
          sha256sum "$OUT_APK" > "${OUT_APK}.sha256"

      - name: Upload Signed Android APK & SHA-256 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roktodei-android-apk
          if-no-files-found: error
          path: |
            cap-build/RoktoDei-v*.apk
            cap-build/RoktoDei-v*.apk.sha256

  publish-github-release:
    name: Publish GitHub Release (on Tag Push v*)
    needs: build-capacitor-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Signed APK & SHA-256
        uses: actions/download-artifact@v4
        with:
          name: roktodei-android-apk
          path: release-assets

      - name: Compose Release Body with SHA-256 Checksum
        id: compose_body
        run: |
          SHA_VAL="$(awk '{print $1}' release-assets/RoktoDei-v*.apk.sha256 | head -n 1)"
          {
            echo "BODY<<EOF"
            echo "## Rokto Dei v${{ needs.build-capacitor-apk.outputs.app_version }}"
            echo ""
            echo "### Android APK Integrity Verification"
            echo "SHA-256: \`$SHA_VAL\`"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ env.BODY }}
          files: |
            release-assets/RoktoDei-v*.apk
            release-assets/RoktoDei-v*.apk.sha256

  build-twa-apk:
    name: Package Play Store TWA APK (Bubblewrap)
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.app_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Non-Interactively
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || ls -1 "$SDK_PATH"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          if [ ! -d "$SDK_PATH/build-tools" ] || [ -z "$(ls -A "$SDK_PATH/build-tools" 2>/dev/null)" ]; then
            yes | "$SDKM" "build-tools;34.0.0" "platforms;android-34"
          fi
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$SDK_PATH"

      - name: Prepare Keystore & TWA Manifest
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          mkdir -p twa-build && cd twa-build
          STORE_PASS="${KS_PASS:-roktodei123}"
          ALIAS_PASS="${KEY_PASS:-$STORE_PASS}"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android.keystore
          else
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias roktodei \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$ALIAS_PASS" \
              -dname "CN=Rokto Dei, OU=Mobile, O=Rokto Dei, L=Dhaka, ST=Dhaka, C=BD"
          fi

          echo "=== Copy this SHA-256 into ASSETLINKS_SHA256 or public/.well-known/assetlinks.json ==="
          keytool -list -v -keystore android.keystore -alias roktodei -storepass "$STORE_PASS" | grep "SHA256:"

          APP_URL="${{ inputs.app_url }}"
          APP_URL="${APP_URL%/}"
          HOST="$(echo "$APP_URL" | sed -E 's|^https?://([^/]+).*|\1|')"

          if ! curl -fsSLI "$APP_URL/pwa-512x512.png" >/dev/null 2>&1; then
            echo "::error::Target app_url ($APP_URL) is not reachable or has not been deployed yet (missing /pwa-512x512.png). Please publish/deploy the web app first and pass its live HTTPS URL."
            exit 1
          fi

          cat <<EOF > twa-manifest.json
          {
            "packageId": "${{ inputs.package_id }}",
            "host": "$HOST",
            "name": "${{ inputs.app_name }}",
            "launcherName": "${{ inputs.app_name }}",
            "display": "standalone",
            "themeColor": "#C80828",
            "navigationColor": "#C80828",
            "navigationColorDark": "#99061E",
            "navigationDividerColor": "#C80828",
            "backgroundColor": "#FAF8F9",
            "enableNotifications": true,
            "startUrl": "/?apk=1",
            "iconUrl": "$APP_URL/pwa-512x512.png",
            "maskableIconUrl": "$APP_URL/pwa-maskable-512x512.png",
            "signingKey": {
              "path": "./android.keystore",
              "alias": "roktodei"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "$APP_URL/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              }
            }
          }
          EOF

      - name: Build Signed TWA APK & AAB
        working-directory: twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD || 'roktodei123' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD || 'roktodei123' }}
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation

      - name: Upload TWA APK & Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roktodei-twa-apk
          if-no-files-found: error
          path: |
            twa-build/*.apk
            twa-build/*.aab
            twa-build/app/build/outputs/apk/**/*.apk
            twa-build/app/build/outputs/bundle/**/*.aab
